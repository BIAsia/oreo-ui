<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Site-level defaults. App.tsx rewrites title/description/canonical/og
         per route (src/lib/head.ts) once the app boots. -->
    <title>Oreo UI — Copy-paste React components for chat and agent interfaces</title>
    <meta
      name="description"
      content="A copy-paste React component library for chat and agent UIs. Base UI behavior, Tailwind v4 design tokens and Motion springs — own the source, theme with CSS variables."
    />
    <link rel="canonical" href="https://oreo-ui-preview.vercel.app/" />

    <!-- Icons: SVG for modern browsers, .ico for the rest, PNG for iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The docs shell is light until the in-page theme switch flips it. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f9f9f9" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oreo UI" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://oreo-ui-preview.vercel.app/" />
    <meta property="og:title" content="Oreo UI — Copy-paste React components for chat and agent interfaces" />
    <meta
      property="og:description"
      content="A copy-paste React component library for chat and agent UIs. Base UI behavior, Tailwind v4 design tokens and Motion springs — own the source, theme with CSS variables."
    />
    <meta property="og:image" content="https://oreo-ui-preview.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Oreo UI mark on a dark surface, above the wordmark and tagline." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oreo UI — Copy-paste React components for chat and agent interfaces" />
    <meta
      name="twitter:description"
      content="A copy-paste React component library for chat and agent UIs. Base UI behavior, Tailwind v4 design tokens and Motion springs — own the source, theme with CSS variables."
    />
    <meta name="twitter:image" content="https://oreo-ui-preview.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Oreo UI is an interactive component gallery — please enable JavaScript to view it.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
